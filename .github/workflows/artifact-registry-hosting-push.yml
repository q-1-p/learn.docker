name: Register docker images to Artifact Registry on push

on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCLOUD_AUTH }}"
      - name: Setup Google Cloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.PROJECT_ID }}
      - name: Configure docker for artifact registry
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev
      - name: set TAG
        run: |
          echo "TAG=$(echo $GITHUB_REF | awk -F/ '{print $NF}')" >> $GITHUB_ENV
      - name: Build
        run: |
          cd api
          docker build -t us-west1-docker.pkg.dev/${{ secrets.PROJECT_ID }}/learn-docker-api/api-image:${{ env.TAG }} .
      - name: Push
        run: |
          docker push us-west1-docker.pkg.dev/${{ secrets.PROJECT_ID }}/learn-docker-api/api-image:${{ env.TAG }}
      - name: Deploy
        run: |-
          gcloud run deploy api-image \
            --project=${{ secrets.PROJECT_ID }} \
            --image=us-west1-docker.pkg.dev/${{ secrets.PROJECT_ID }}/learn-docker-api/api-image:${{ env.TAG }} \
            --region=us-west1 \
            --service-account=${{ secrets.SERVICE_ACCOUNT }} \
            --allow-unauthenticated \
            --port=8080